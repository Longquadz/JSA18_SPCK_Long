<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng nhập - TechZone</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="styles/login.css" />
  </head>
  <body>
    <div class="auth-container">
      <!-- CỘT TRÁI: BANNERS & LOGO -->
      <div class="auth-banner">
        <div class="brand-logo">TechZone</div>
        <div class="banner-content">
          <h1>Chào mừng bạn<br />quay trở lại!</h1>
          <p>
            Đăng nhập để trải nghiệm không gian mua sắm công nghệ tối giản và
            siêu tốc.
          </p>
        </div>
        <a href="./index.html" class="back-home-link">
          <i class="fa-solid fa-arrow-left"></i> Quay lại trang chủ
        </a>
      </div>

      <!-- CỘT PHẢI: FORM ĐĂNG NHẬP -->
      <div class="auth-form-container">
        <div class="auth-form-card">
          <h2 class="auth-title">ĐĂNG NHẬP</h2>
          <p class="auth-subtitle">Vui lòng nhập thông tin tài khoản của bạn</p>

          <form id="login-form">
            <div class="form-group">
              <label for="username">Số điện thoại hoặc Email</label>
              <input
                type="text"
                id="username"
                placeholder="Nhập SĐT hoặc Email..."
                required
              />
            </div>

            <div class="form-group">
              <label for="password">Mật khẩu</label>
              <input
                type="password"
                id="password"
                placeholder="Nhập mật khẩu..."
                required
              />
            </div>

            <button type="submit" class="btn-submit">ĐĂNG NHẬP</button>
          </form>

          <div class="auth-switch">
            Chưa có tài khoản? <a href="./register.html">Đăng ký ngay</a>
          </div>
        </div>
      </div>
    </div>

    <!-- KHUNG THÔNG BÁO MESSAGE BOX -->
    <div id="custom-alert" class="custom-alert hidden">
      <div class="alert-content">
        <i id="alert-icon" class="fa-solid fa-circle-check"></i>
        <p id="alert-message">Thông báo ở đây...</p>
        <button id="alert-close-btn">Đóng</button>
      </div>
    </div>

    <script src="scripts/auth.js"></script>
  </body>
</html>
